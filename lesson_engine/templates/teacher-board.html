<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="数学老师逐步推导与检验的互动黑板" />
  <title>__LESSON_TITLE__</title>
  <style>
    :root {
      --desk: #080d12;
      --desk-2: #0f1720;
      --board: #17352e;
      --board-2: #1a3d35;
      --chalk: #f6f1dc;
      --chalk-soft: #c9d9d1;
      --chalk-dim: #8caaa0;
      --yellow: #ffd166;
      --cyan: #70e1d0;
      --pink: #ff8fa3;
      --green: #8ae99e;
      --wood: #5b3b25;
      --wood-dark: #3a2417;
      --paper: #fff8e8;
      --paper-ink: #2e342f;
      --danger: #ff6b6b;
      --chalk-font: "KaiTi", "STKaiti", "Microsoft YaHei", "PingFang SC", sans-serif;
      --ui-font: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --math-font: "Cambria Math", "Times New Roman", "Microsoft YaHei", serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--chalk);
      background:
        radial-gradient(circle at 15% 0%, rgba(255, 209, 102, 0.08), transparent 24%),
        radial-gradient(circle at 88% 100%, rgba(112, 225, 208, 0.08), transparent 28%),
        linear-gradient(145deg, var(--desk), var(--desk-2));
      font-family: var(--ui-font);
    }
    button, select { font: inherit; }
    button:focus-visible, select:focus-visible { outline: 3px solid rgba(255, 209, 102, 0.45); outline-offset: 2px; }
    .app { width: 100%; height: 100%; display: flex; flex-direction: column; }

    .topbar {
      min-height: 58px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); background: rgba(7, 12, 17, 0.82);
      backdrop-filter: blur(16px); z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-badge {
      width: 44px; height: 44px; flex: 0 0 auto; display: grid; place-items: center;
      border: 1px solid rgba(255, 209, 102, 0.35); border-radius: 14px; color: var(--yellow);
      background: rgba(255, 209, 102, 0.08); font-size: 20px; font-weight: 900;
    }
    .brand-copy { min-width: 0; }
    .brand-copy strong, .brand-copy span { display: block; }
    .brand-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; letter-spacing: 0.03em; }
    .brand-copy span { margin-top: 3px; color: #8fa4a0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .quick-step-nav { display: flex; align-items: center; gap: 7px; padding: 5px; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; background: rgba(255,255,255,0.035); }
    .quick-step-button { min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 5px; }
    .quick-step-button.is-primary { border-color: rgba(112,225,208,0.5); color: #071916; background: linear-gradient(145deg, #8cebdd, #5fd3c2); box-shadow: 0 8px 20px rgba(112,225,208,0.15); }
    .quick-step-button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .quick-step-count { min-width: 54px; text-align: center; color: var(--chalk-soft); font-size: 12px; font-weight: 900; }
    .top-progress { width: min(250px, 20vw); display: flex; align-items: center; gap: 9px; color: #9cb2ad; font-size: 11px; font-weight: 700; }
    .progress-track { height: 6px; flex: 1; border-radius: 999px; background: rgba(255, 255, 255, 0.09); overflow: hidden; }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--cyan), var(--yellow)); transition: width 420ms ease; }
    .ui-button {
      min-height: 40px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px;
      color: var(--chalk); background: rgba(255, 255, 255, 0.055); cursor: pointer; font-size: 13px; font-weight: 800;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .ui-button:hover { transform: translateY(-1px); border-color: rgba(255, 209, 102, 0.45); background: rgba(255, 209, 102, 0.08); }
    .ui-button.is-on { border-color: rgba(112, 225, 208, 0.45); color: var(--cyan); background: rgba(112, 225, 208, 0.09); }
    .control-button:disabled, .ui-button:disabled { opacity: 0.36; cursor: not-allowed; transform: none; }

    .classroom { flex: 1; min-height: 0; padding: 10px 12px 6px; }
    .blackboard {
      width: 100%; height: 100%; position: relative; overflow: hidden; border: 12px solid var(--wood); border-radius: 18px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        radial-gradient(circle at 20% 0%, rgba(112, 225, 208, 0.06), transparent 26%),
        linear-gradient(145deg, var(--board), var(--board-2));
      background-size: 28px 28px, 28px 28px, auto, auto;
      box-shadow: inset 0 0 0 3px var(--wood-dark), inset 0 0 80px rgba(0, 0, 0, 0.28), 0 24px 60px rgba(0, 0, 0, 0.38);
    }
    .blackboard::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.28;
      background: repeating-linear-gradient(115deg, transparent 0 7px, rgba(255, 255, 255, 0.012) 7px 8px), radial-gradient(circle at 75% 30%, rgba(255, 255, 255, 0.04), transparent 25%);
      mix-blend-mode: screen;
    }
    .blackboard:fullscreen { border-width: 0; border-radius: 0; }
    .board-layout { height: 100%; position: relative; display: flex; flex-direction: column; z-index: 1; }

    .question-panel {
      flex: 0 0 auto; min-height: 0; padding: 11px 16px 10px; display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.85fr); gap: 16px; align-items: start;
      border-bottom: 1px dashed rgba(246, 241, 220, 0.22);
    }
    .question-side { min-width: 0; }
    .exam-line { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .exam-tag, .topic-tag { display: inline-flex; align-items: center; min-height: 25px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: 0.04em; }
    .exam-tag { color: #1c241e; background: var(--yellow); }
    .topic-tag { border: 1px solid rgba(112, 225, 208, 0.36); color: var(--cyan); background: rgba(112, 225, 208, 0.07); }
    .question-text { margin: 0; color: #fbf7e8; font-family: var(--chalk-font); font-size: clamp(13px, 0.98vw, 17px); line-height: 1.5; letter-spacing: 0.01em; overflow-wrap: anywhere; }
    .question-text .math { font-family: var(--math-font); font-style: italic; white-space: nowrap; }
    .answer-line { margin-top: 7px; color: var(--chalk-dim); font-size: 12px; }
    .options-panel { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .options-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .option {
      min-height: 42px; padding: 6px 9px; display: grid; grid-template-columns: 30px minmax(0, 1fr); align-items: center; gap: 7px;
      border: 1px solid rgba(246, 241, 220, 0.18); border-radius: 12px; color: var(--chalk); background: rgba(255, 255, 255, 0.035);
      text-align: left; cursor: pointer; font-family: var(--chalk-font); font-size: 13px; line-height: 1.35;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, opacity 180ms ease;
    }
    .option:hover { transform: translateY(-1px); border-color: rgba(255, 209, 102, 0.42); background: rgba(255, 209, 102, 0.07); }
    .option-key { width: 27px; height: 27px; display: grid; place-items: center; border: 1px solid rgba(246, 241, 220, 0.24); border-radius: 9px; color: var(--yellow); font-family: var(--ui-font); font-weight: 900; }
    .option.selected { border-color: rgba(255, 209, 102, 0.72); box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.08); }
    .option.is-correct { border-color: rgba(138, 233, 158, 0.74); color: #f1fff3; background: rgba(138, 233, 158, 0.13); box-shadow: 0 0 0 2px rgba(138, 233, 158, 0.08); }
    .option.is-correct .option-key { border-color: var(--green); color: #142219; background: var(--green); }
    .option.is-wrong { border-color: rgba(255, 107, 107, 0.72); background: rgba(255, 107, 107, 0.1); }
    .option.is-wrong .option-key { border-color: var(--danger); color: #ffffff; background: var(--danger); }
    .student-feedback { min-height: 18px; color: var(--chalk-dim); font-size: 11.5px; line-height: 1.45; }
    .student-feedback strong { color: var(--yellow); }

    .work-area { min-height: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(296px, 0.86fr); }
    .diagram-area { min-width: 0; min-height: 0; position: relative; overflow: hidden; border-right: 1px dashed rgba(246, 241, 220, 0.18); }
    #diagram { width: 100%; height: 100%; display: block; overflow: visible; }
    .diagram-title { fill: var(--chalk-soft); font-family: var(--chalk-font); font-size: 19px; letter-spacing: 0.06em; }
    .diagram-subtitle { fill: var(--chalk-dim); font-family: var(--ui-font); font-size: 12px; }
    .hex-face { fill: rgba(255, 255, 255, 0.025); stroke: var(--chalk); stroke-width: 3.5; stroke-linejoin: round; }
    .frame-line { stroke: rgba(246, 241, 220, 0.22); stroke-width: 1.5; stroke-dasharray: 7 8; }
    .point { fill: var(--board); stroke: var(--yellow); stroke-width: 4; }
    .point.is-blue { stroke: var(--cyan); }
    .point-label, .potential-label { font-family: var(--math-font); font-style: italic; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .point-label { fill: var(--chalk); font-size: 27px; }
    .potential-label { fill: var(--yellow); font-size: 23px; }
    .potential-label.blue { fill: var(--cyan); }
    .potential-label.pink { fill: var(--pink); }
    .aux-line { fill: none; stroke: var(--cyan); stroke-width: 3; stroke-dasharray: 10 8; stroke-linecap: round; }
    .equal-line { fill: none; stroke: var(--yellow); stroke-width: 4; stroke-linecap: round; }
    .vertical-line { fill: none; stroke: var(--pink); stroke-width: 3.5; stroke-linecap: round; }
    .field-arrow { fill: none; stroke: var(--pink); stroke-width: 4; stroke-linecap: round; }
    .formula-text { fill: var(--yellow); font-family: var(--math-font); font-size: 22px; font-weight: 700; }
    .formula-text.pink { fill: var(--pink); }
    .note-text { fill: var(--chalk-soft); font-family: var(--chalk-font); font-size: 17px; }
    .reveal { opacity: 0; transition: opacity 520ms ease, transform 520ms cubic-bezier(0.2, 0.75, 0.3, 1); transform-box: fill-box; transform-origin: center; }
    .reveal.is-visible { opacity: 1; transform: translateY(0) scale(1); }
    .reveal.lift { transform: translateY(12px) scale(0.96); }
    .teacher-pointer { opacity: 0; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.34)); transition: transform 760ms cubic-bezier(0.2, 0.82, 0.24, 1), opacity 240ms ease; pointer-events: none; }
    .teacher-pointer.is-visible { opacity: 1; }
    .teacher-pointer .pointer-arrow { fill: var(--yellow); stroke: #2c2515; stroke-width: 2; }
    .teacher-pointer .pointer-dot { fill: var(--yellow); }
    .teacher-pointer .pointer-ripple { fill: none; stroke: var(--yellow); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; }
    .teacher-pointer .pointer-ripple.is-pulsing { animation: pointerRipple 720ms ease-out; }
    .diagram-element.is-pointed { filter: drop-shadow(0 0 7px var(--element-color)) drop-shadow(0 0 16px var(--element-color)); }
    .diagram-element.is-pointed text, .diagram-element.is-pointed .diagram-label { fill: #fffdf2; }
    @keyframes pointerRipple { 0% { opacity: 0.92; transform: scale(0.5); } 100% { opacity: 0; transform: scale(3.1); } }
    .inset-box { fill: rgba(7, 18, 17, 0.42); stroke: rgba(112, 225, 208, 0.32); stroke-width: 1.5; }

    .teacher-console {
      min-width: 0; min-height: 0; padding: 11px 13px 9px; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 8px;
      overflow: hidden; background: linear-gradient(180deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.03));
    }
    .teacher-row { display: grid; grid-template-columns: 60px minmax(0, 1fr); align-items: start; gap: 10px; }
    .teacher-avatar {
      width: 60px; height: 60px; padding: 4px; border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 18px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)); transition: box-shadow 180ms ease, transform 180ms ease;
    }
    .teacher-avatar.is-speaking { transform: translateY(-2px); box-shadow: 0 0 0 4px rgba(255, 209, 102, 0.08), 0 8px 28px rgba(0, 0, 0, 0.22); }
    .teacher-avatar svg { width: 100%; height: 100%; display: block; }
    .speech-bubble { min-width: 0; position: relative; padding: 10px 12px; border-radius: 14px; color: var(--paper-ink); background: var(--paper); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22); }
    .speech-bubble::before { content: ""; position: absolute; left: -8px; top: 22px; width: 16px; height: 16px; transform: rotate(45deg); background: var(--paper); }
    .teacher-kicker { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; color: #887346; font-size: 11px; font-weight: 900; letter-spacing: 0.08em; }
    .teacher-kicker span:last-child { color: #83918c; font-weight: 700; letter-spacing: 0; }
    .speech-bubble h2 { margin: 0 0 4px; color: #202721; font-family: var(--chalk-font); font-size: clamp(15px, 1.0vw, 19px); line-height: 1.3; }
    .speech-bubble p { margin: 0; color: #4b5651; font-size: 12.5px; line-height: 1.6; }
    .formula-card, .tip-card { border-radius: 14px; }
    .formula-card { padding: 9px 11px; border: 1px solid rgba(255, 209, 102, 0.22); background: rgba(255, 209, 102, 0.055); }
    /* 只作用于“板书推演”这个标题标签；不要命中公式内部的 span（分式/上下标会被撑成整行）。 */
    .formula-card > span { display: block; margin-bottom: 5px; color: #b8a878; font-size: 10px; font-weight: 900; letter-spacing: 0.12em; }
    .formula-card div { color: var(--yellow); font-family: var(--math-font); font-size: clamp(13px, 0.98vw, 18px); line-height: 1.5; overflow-wrap: anywhere; }
    .tip-card { padding: 8px 10px; border: 1px solid rgba(112, 225, 208, 0.18); color: #b7d7ce; background: rgba(112, 225, 208, 0.05); font-family: var(--chalk-font); font-size: 12.5px; line-height: 1.5; }
    .tip-card strong { color: var(--cyan); }

    .lesson-map { min-height: 0; display: flex; flex-direction: column; padding-top: 2px; }
    .lesson-map-label { margin-bottom: 5px; color: #819c95; font-size: 10px; font-weight: 900; letter-spacing: 0.12em; }
    .step-list { min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; align-content: start; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(112, 225, 208, 0.32) transparent; }
    .step-chip {
      min-height: 32px; padding: 5px 8px; display: grid; grid-template-columns: 21px minmax(0, 1fr); align-items: center; gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 10px; color: #9db2ac; background: rgba(255, 255, 255, 0.025);
      text-align: left; cursor: pointer; font-size: 10.5px; font-weight: 700; line-height: 1.3; transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
    }
    .step-chip span:first-child { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: #abc0ba; background: rgba(255, 255, 255, 0.06); font-size: 9.5px; }
    .step-chip:hover { border-color: rgba(255, 209, 102, 0.3); color: var(--chalk); }
    .step-chip.is-active { border-color: rgba(255, 209, 102, 0.52); color: var(--yellow); background: rgba(255, 209, 102, 0.08); }
    .step-chip.is-active span:first-child { color: #1c241e; background: var(--yellow); }
    .step-chip.is-done { color: var(--cyan); }
    .controls {
      flex: 0 0 auto; min-height: 56px; padding: 6px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: linear-gradient(180deg, rgba(8, 13, 18, 0.12), rgba(8, 13, 18, 0.7));
    }
    .control-left, .control-right { display: flex; align-items: center; gap: 9px; }
    .control-button, .play-button {
      min-height: 40px; border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 12px; color: var(--chalk);
      background: rgba(255, 255, 255, 0.055); cursor: pointer; font-weight: 900; transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .control-button:hover, .play-button:hover { transform: translateY(-1px); border-color: rgba(255, 209, 102, 0.45); }
    .control-button { min-width: 40px; padding: 0 12px; font-size: 17px; }
    .control-button.text { font-size: 13px; }
    .play-button {
      min-width: 148px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-color: #f2be54; color: #172018; background: linear-gradient(145deg, #ffe08b, #f7c75d); box-shadow: 0 10px 24px rgba(255, 209, 102, 0.18); font-size: 14px;
    }
    .play-button.is-playing { border-color: var(--cyan); color: #071916; background: linear-gradient(145deg, #8cebdd, #5fd3c2); box-shadow: 0 10px 24px rgba(112, 225, 208, 0.17); }
    .speed-label { display: flex; align-items: center; gap: 7px; color: #8fa5a0; font-size: 12px; font-weight: 800; }
    .speed-label select { min-height: 40px; padding: 0 10px; border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 11px; color: var(--chalk); background: #18252a; cursor: pointer; font-weight: 800; }
    .keyboard-hint { position: absolute; right: 18px; bottom: 8px; z-index: 2; color: rgba(201, 217, 209, 0.48); font-size: 10px; pointer-events: none; }
    .chalk-in { animation: chalkIn 520ms cubic-bezier(0.2, 0.8, 0.25, 1); }
    @keyframes chalkIn {
      from { opacity: 0; transform: translateY(8px); filter: blur(2px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @media (max-height: 820px) {
      .topbar { min-height: 52px; }
      .brand-badge { width: 38px; height: 38px; }
      .question-panel { padding: 9px 14px 8px; gap: 13px; }
      .question-text { font-size: clamp(12.5px, 0.92vw, 15.5px); line-height: 1.42; }
      .option { min-height: 38px; font-size: 12.5px; }
      .teacher-row { grid-template-columns: 52px minmax(0, 1fr); }
      .teacher-avatar { width: 52px; height: 52px; border-radius: 16px; }
      .speech-bubble p { font-size: 12px; line-height: 1.5; }
      .controls { min-height: 50px; padding: 5px 14px 6px; }
      .play-button { min-width: 132px; }
      .keyboard-hint { display: none; }
    }

    @media (max-width: 1200px) {
      .question-panel { grid-template-columns: minmax(0, 1fr) minmax(350px, 0.68fr); gap: 16px; }
      .work-area { grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr); }
      .top-progress { display: none; }
      .quick-label { display: none; }
      .quick-step-button { padding: 0 10px; }
    }
    @media (max-width: 980px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100%; }
      .topbar { flex-wrap: wrap; padding: 12px 14px; }
      .classroom { min-height: 900px; padding: 12px; }
      .blackboard { min-height: 860px; }
      .board-layout { min-height: 836px; }
      .question-panel { grid-template-columns: 1fr; }
      .work-area { grid-template-columns: 1fr; }
      .diagram-area { min-height: 500px; border-right: 0; border-bottom: 1px dashed rgba(246, 241, 220, 0.18); }
      .teacher-console { min-height: 380px; }
      .controls { flex-wrap: wrap; }
      .keyboard-hint { display: none; }
    }
    @media (max-width: 620px) {
      .brand-copy span, .top-actions .ui-button:not(.keep-mobile) { display: none; }
      .question-panel { padding: 13px; }
      .options-grid { grid-template-columns: 1fr; }
      .teacher-row { grid-template-columns: 58px minmax(0, 1fr); }
      .teacher-avatar { width: 58px; height: 58px; border-radius: 17px; }
      .step-list { grid-template-columns: 1fr; }
      .control-left, .control-right { width: 100%; justify-content: center; }
      .play-button { min-width: 140px; }
    }

    .math-line { margin: 0 0 8px; line-height: 1.8; }
    .math-line:last-child { margin-bottom: 0; }
    .math-line .math-base { font-style: normal; }
    .math-line .math-sub { font-size: 0.68em; vertical-align: -0.28em; }
    .math-line .math-sup { font-size: 0.68em; vertical-align: 0.45em; }
    .math-line .math-note { display: block; margin-top: 3px; color: #b8a878; font-family: var(--chalk-font); font-size: 0.72em; }
    .math-line .accent { color: var(--cyan); }
    .math-line.muted { color: #9db2ac; font-family: var(--chalk-font); }
    .math-fraction { display: inline-flex; flex-direction: column; align-items: center; margin: 0 4px; vertical-align: middle; font-size: 0.82em; line-height: 1.05; }
    .math-fraction-top { padding: 0 5px 2px; }
    .math-fraction-bottom { padding: 2px 5px 0; border-top: 2px solid currentColor; }
    .math-sqrt { display: inline-flex; align-items: center; }
    .math-sqrt-symbol { padding-right: 1px; border-top: 2px solid currentColor; }
    .comparison-row { padding: 7px 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 6px; }
    .comparison-row.is-correct { border-color: rgba(138,233,158,0.5); color: var(--green); }
    .comparison-row.is-wrong { border-color: rgba(255,107,107,0.45); color: var(--pink); }
    .comparison-label { display: inline-block; min-width: 54px; color: var(--chalk-soft); font-family: var(--chalk-font); }
    .comparison-value { font-family: var(--math-font); }
    .comparison-reason { display: block; margin-top: 3px; color: #9db2ac; font-family: var(--chalk-font); font-size: 0.78em; }
    .diagram-element { opacity: 0; animation: diagramIn 420ms ease forwards; }
    .diagram-element.is-active { filter: drop-shadow(0 0 8px var(--element-color)); }
    /* 当前步骤涉及的图元/矢量加粗：is-active 是本步要讲的对象，is-pointed 是指针刚点过的对象。 */
    .diagram-element.is-active line, .diagram-element.is-active polyline, .diagram-element.is-active polygon, .diagram-element.is-active rect,
    .diagram-element.is-pointed line, .diagram-element.is-pointed polyline, .diagram-element.is-pointed polygon, .diagram-element.is-pointed rect { stroke-width: var(--element-width-strong, 5px); }
    .diagram-element.is-active .diagram-label, .diagram-element.is-pointed .diagram-label { font-weight: 800; }
    .diagram-element text, .diagram-label { font-family: var(--chalk-font); font-size: 22px; font-weight: 700; paint-order: stroke; stroke: rgba(8,13,18,0.45); stroke-width: 3px; }
    .diagram-area svg { width: 100%; height: 100%; display: block; }
    .diagram-area image { opacity: 0.94; }
    .comparison-card { position: absolute; right: 18px; top: 18px; width: min(290px, 38%); padding: 11px; border: 1px solid rgba(112,225,208,0.28); border-radius: 13px; background: rgba(7,18,17,0.88); box-shadow: 0 12px 28px rgba(0,0,0,0.26); }
    .comparison-card-row { padding: 7px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
    .comparison-card-row:last-child { border-bottom: 0; }
    .comparison-card-row strong, .comparison-card-row span, .comparison-card-row small { display: block; }
    .comparison-card-row strong { color: var(--yellow); font-family: var(--chalk-font); }
    .comparison-card-row span { margin-top: 2px; color: var(--chalk); font-family: var(--math-font); }
    .comparison-card-row small { margin-top: 3px; color: #9db2ac; line-height: 1.45; }
    .comparison-card-row.is-correct span { color: var(--green); }
    .comparison-card-row.is-wrong span { color: var(--pink); }

    .metric-board {
      position: absolute; left: 14px; top: 14px; width: min(230px, 30%); padding: 9px 11px 10px;
      border: 1px solid rgba(255, 209, 102, 0.22); border-radius: 12px; pointer-events: none;
      background: rgba(8, 13, 18, 0.78); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22); backdrop-filter: blur(3px);
    }
    .metric-bars-label { margin-bottom: 6px; color: #9db2ac; font-size: 9.5px; font-weight: 900; letter-spacing: 0.14em; }
    .metric-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 7px; margin-bottom: 5px; }
    .metric-bar:last-child { margin-bottom: 0; }
    .metric-bar-name { min-width: 44px; color: #b7d7ce; font-size: 10.5px; font-weight: 700; }
    .metric-bar-track { height: 8px; border-radius: 5px; overflow: hidden; background: rgba(255, 255, 255, 0.08); }
    .metric-bar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--cyan), var(--yellow)); transition: width 420ms cubic-bezier(0.2, 0.75, 0.3, 1); }
    .metric-bar-value { min-width: 46px; color: var(--yellow); font-family: var(--math-font); font-size: 11px; text-align: right; }

    .inspect-layer { position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; z-index: 3; }
    .inspect-panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(300px, 60%); max-height: 76%;
      padding: 13px 14px 14px; overflow-y: auto; pointer-events: auto;
      border: 1px solid rgba(255, 209, 102, 0.34); border-radius: 15px; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
      background: linear-gradient(165deg, rgba(22, 32, 30, 0.97), rgba(10, 18, 17, 0.97));
      scrollbar-width: thin; scrollbar-color: rgba(255, 209, 102, 0.3) transparent;
    }
    .inspect-title {
      padding-bottom: 8px; margin-bottom: 9px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.14); color: var(--yellow);
      font-family: var(--chalk-font); font-size: 15px; font-weight: 900; letter-spacing: 0.03em;
    }
    .inspect-close {
      width: 24px; height: 24px; flex: none; display: grid; place-items: center; border: 0; border-radius: 8px; cursor: pointer;
      color: #9db2ac; background: rgba(255, 255, 255, 0.08); font-size: 15px; line-height: 1; transition: color 140ms ease, background 140ms ease;
    }
    .inspect-close:hover { color: #fff; background: rgba(255, 107, 107, 0.5); }
    .inspect-section { margin-bottom: 9px; }
    .inspect-section:last-child { margin-bottom: 0; }
    .inspect-section-title { margin-bottom: 5px; color: #819c95; font-size: 10px; font-weight: 900; letter-spacing: 0.12em; }
    .inspect-row { padding: 5px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 1px dashed rgba(255,255,255,0.07); }
    .inspect-row:last-child { border-bottom: 0; }
    .inspect-key { color: var(--chalk); font-family: var(--chalk-font); font-size: 12.5px; }
    .inspect-val { color: var(--yellow); font-family: var(--math-font); font-size: 12px; text-align: right; }
    .inspect-note { display: block; margin-top: 2px; color: #9db2ac; font-size: 10.5px; line-height: 1.4; }
    .diagram-element { cursor: default; }
    .diagram-element.is-clickable { cursor: pointer; }
    .diagram-element.draw-element line, .diagram-element.draw-element polygon, .diagram-element.draw-element polyline { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawStroke 900ms ease forwards; }
    @keyframes drawStroke { to { stroke-dashoffset: 0; } }
    @keyframes diagramIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-badge">数</div>
        <div class="brand-copy">
          <strong id="lessonTitle">__LESSON_TITLE__</strong>
          <span>Teacher-style interactive lesson</span>
        </div>
      </div>
      <div class="quick-step-nav" aria-label="快捷翻页">
        <button class="ui-button quick-step-button" id="topPrevButton" type="button" aria-label="上一步">‹ <span class="quick-label">上一步</span></button>
        <span class="quick-step-count" id="topStepCounter">1 / 1</span>
        <button class="ui-button quick-step-button is-primary" id="topNextButton" type="button" aria-label="下一步"><span class="quick-label">下一步</span> ›</button>
      </div>
      <div class="top-actions">
        <div class="top-progress" aria-label="课程进度">
          <span id="progressText">0 / 7</span>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <button class="ui-button is-on" id="voiceTopButton" type="button">语音：开</button>
        <button class="ui-button keep-mobile" id="fullscreenButton" type="button">全屏黑板</button>
      </div>
    </header>

    <main class="classroom">
      <section class="blackboard" id="blackboard">
        <div class="board-layout">
          <section class="question-panel">
            <div class="question-side">
              <div class="exam-line">
                <span class="exam-tag" id="lessonSubject">题目讲解</span>
                <span class="topic-tag" id="lessonTopic">互动讲题</span>
              </div>
              <p class="question-text" id="questionText"></p>
              <div class="answer-line" id="answerLine"></div>
            </div>

            <div class="options-panel">
              <div class="options-grid" id="optionsGrid"></div>
              <div class="student-feedback" id="studentFeedback">你可以先点选一个答案，老师公布答案时会一起判断。</div>
            </div>
          </section>

          <section class="work-area">
            <div class="diagram-area" id="diagramArea">
              <svg id="diagram" viewBox="0 0 960 580" role="img" aria-label="题目图形"></svg>
              <div class="metric-board" id="metricBoard"></div>
              <div class="inspect-layer" id="inspectLayer"></div>
            </div>

            <aside class="teacher-console">
              <div class="teacher-row">
                <div class="teacher-avatar" id="teacherAvatar" aria-hidden="true">
                  <svg viewBox="0 0 100 100">
                    <defs><linearGradient id="faceGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe4c7"></stop><stop offset="1" stop-color="#efc59f"></stop></linearGradient></defs>
                    <circle cx="50" cy="37" r="25" fill="url(#faceGradient)"></circle>
                    <path d="M23 34 Q27 7 51 10 Q73 12 77 36 Q64 24 50 24 Q37 24 23 34Z" fill="#28332f"></path>
                    <path d="M27 41 Q36 35 44 40" fill="none" stroke="#3d4a45" stroke-width="2.5" stroke-linecap="round"></path>
                    <path d="M56 40 Q64 35 73 41" fill="none" stroke="#3d4a45" stroke-width="2.5" stroke-linecap="round"></path>
                    <circle cx="37" cy="43" r="7" fill="none" stroke="#26312e" stroke-width="3"></circle>
                    <circle cx="63" cy="43" r="7" fill="none" stroke="#26312e" stroke-width="3"></circle>
                    <path d="M44 43 L56 43" stroke="#26312e" stroke-width="3" stroke-linecap="round"></path>
                    <path d="M41 55 Q50 62 60 54" fill="none" stroke="#9b5b55" stroke-width="2.5" stroke-linecap="round"></path>
                    <path d="M18 91 Q22 68 50 68 Q78 68 82 91" fill="#3e7d78"></path>
                    <path d="M50 69 L37 91" stroke="#f4d8b8" stroke-width="4" stroke-linecap="round"></path>
                    <path d="M50 69 L65 91" stroke="#f4d8b8" stroke-width="4" stroke-linecap="round"></path>
                    <path d="M72 78 L92 58" stroke="#f4d8b8" stroke-width="4" stroke-linecap="round"></path>
                    <circle cx="93" cy="57" r="4" fill="#ffd166"></circle>
                  </svg>
                </div>
                <div class="speech-bubble">
                  <div class="teacher-kicker"><span>老师讲解</span><span id="stepCounter">准备上课</span></div>
                  <h2 id="stepTitle">同学们，先看题，不要一上来就套公式</h2>
                  <p id="stepText">老师会先带你找方向，再画辅助线，最后判断选项。准备好后，点击下面的“开始上课”。</p>
                </div>
              </div>
              <div class="formula-card"><span>板书推演</span><div id="formulaBoard">a = 2 cm = 0.02 m　 h = 1 cm = 0.01 m</div></div>
              <div class="tip-card" id="tipBoard"><strong>老师提示：</strong>匀强电场中，沿任意直线走过相同距离，电势变化相同。</div>
              <div class="lesson-map">
                <div class="lesson-map-label">课堂步骤 · 点击可跳转</div>
                <div class="step-list" id="stepList"></div>
              </div>
            </aside>
          </section>
        </div>
      </section>
    </main>

    <footer class="controls">
      <div class="control-left">
        <button class="control-button" id="prevButton" type="button" aria-label="上一步">‹</button>
        <button class="play-button" id="playButton" type="button"><span id="playIcon">▶</span><span id="playLabel">开始上课</span></button>
        <button class="control-button" id="nextButton" type="button" aria-label="下一步">›</button>
        <button class="control-button text" id="replayButton" type="button">↺ 重讲</button>
      </div>
      <div class="control-right">
        <label class="speed-label">语速<select id="speedSelect" aria-label="老师语速"><option value="0.8">慢速</option><option value="1" selected>正常</option><option value="1.15">稍快</option><option value="1.3">快速</option></select></label>
        <button class="ui-button is-on" id="voiceButton" type="button" aria-pressed="true">老师语音：开</button>
      </div>
    </footer>
    <div class="keyboard-hint">空格：讲课/暂停 · ← →：切换步骤 · R：重讲 · F：全屏</div>
  </div>

  <script id="lesson-data" type="application/json">__LESSON_JSON__</script>
<script>
__CLIENT_RENDERER__
</script>
</body>
</html>
