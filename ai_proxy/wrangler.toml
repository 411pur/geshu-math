name = "geshu-math-ai-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 公开变量（非机密）。机密请用：wrangler secret put UPSTREAM_API_KEY
[vars]
# 上游 OpenAI 兼容服务地址，必须填成 `<host>/v1` 形式（网关会拼 /chat/completions）。
# 例：https://your-host/v1 —— 不要提交带私有域名的真实地址。
UPSTREAM_BASE_URL = ""
# 允许客户端请求的模型白名单（逗号分隔）；留空 = 不限制（不推荐公网使用）
ALLOWED_MODELS = ""
# 允许跨域的前端来源；部署后请把 "*" 收紧成站点域名
ALLOW_ORIGIN = "*"
